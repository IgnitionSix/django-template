version: '3.4'

x-common-variables: &common-variables
  S3_HOST: "s3:9000"
  S3_ACCESS_KEY: "minio"
  S3_ACCESS_SECRET: "miniominio"
  S3_BUCKET_NAME: "default_bucket"
  POSTGRES_DB: defaultapp
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: db
  ENVIRONMENT: local
  
x-app: &default-app
  build: ./appimage
  volumes:
    - ./appimage/baseapp:/code/baseapp
  networks:
    - backend

services:
        
  db:
    image: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/
    environment:
      <<: *common-variables
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
        - backend

  app:
    <<: *default-app
    environment:
      <<: *common-variables
    ports:
      - "8000:8000"

  tailwind:
    <<: *default-app
    command: /bin/sh /code/baseapp/run_tailwind.sh
    tty: true
      
networks:
  backend:
    driver: "bridge"
    