name: app

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: appimage/baseapp/core/static_src/package-lock.json

      - name: Install Python dependencies
        working-directory: ./appimage/baseapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./appimage/baseapp/core/static_src
        run: npm ci

      - name: Build frontend assets
        working-directory: ./appimage/baseapp/core/static_src
        run: npm run build

      - name: Ruff
        working-directory: ./appimage/baseapp
        run: |
          ruff check .
          ruff format --check .

      - name: Django tests
        working-directory: ./appimage/baseapp
        run: python manage.py test --settings=app.settings.test

      - name: Django deploy check with sample env
        working-directory: ./appimage/baseapp
        env:
          DJANGO_SECRET_KEY: ci-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          POSTGRES_DB: defaultapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
        run: python manage.py check --deploy --fail-level WARNING --settings=app.settings.production
