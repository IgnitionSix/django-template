name: deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "terraform/aws/image.auto.tfvars.json"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
  ECS_WEB_TASK_DEFINITION: ${{ vars.ECS_WEB_TASK_DEFINITION }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
  ECS_WORKER_TASK_DEFINITION: ${{ vars.ECS_WORKER_TASK_DEFINITION }}
  ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
  ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
  ECS_LOG_GROUP: ${{ vars.ECS_LOG_GROUP }}
  CONTAINER_PORT_MAPPING_NAME: ${{ vars.CONTAINER_PORT_MAPPING_NAME }}
  CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
  DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.DJANGO_CSRF_TRUSTED_ORIGINS }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER }}
  POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
  REDIS_URL: ${{ vars.REDIS_URL }}
  SECURE_SSL_REDIRECT: ${{ vars.SECURE_SSL_REDIRECT }}
  SECURE_HSTS_SECONDS: ${{ vars.SECURE_HSTS_SECONDS }}
  DJANGO_SECRET_KEY_SECRET_ARN: ${{ vars.DJANGO_SECRET_KEY_SECRET_ARN }}
  DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
  TASK_CPU: ${{ vars.TASK_CPU }}
  TASK_MEMORY: ${{ vars.TASK_MEMORY }}
  TASK_CPU_ARCHITECTURE: ${{ vars.TASK_CPU_ARCHITECTURE }}
  TASK_OPERATING_SYSTEM_FAMILY: ${{ vars.TASK_OPERATING_SYSTEM_FAMILY }}
  APP_ENVIRONMENT_JSON: ${{ vars.APP_ENVIRONMENT_JSON }}
  APP_SECRETS_JSON: ${{ vars.APP_SECRETS_JSON }}
  IMAGE_VARS_FILE: terraform/aws/image.auto.tfvars.json

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          latest_uri="${ECR_REPOSITORY_URI}:latest"

          docker build -t "${image_uri}" -t "${latest_uri}" ./appimage
          docker push "${image_uri}"
          docker push "${latest_uri}"

          echo "image=${image_uri}" >> "${GITHUB_OUTPUT}"

      - name: Record image URI for Terraform
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["IMAGE_VARS_FILE"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps({"container_image": os.environ["IMAGE_URI"]}, indent=2)
              + "\n"
          )
          PY

      - name: Render web task definition
        env:
          CONTAINER_IMAGE: ${{ steps.build-image.outputs.image }}
          TASK_DEFINITION_FAMILY: ${{ env.ECS_WEB_TASK_DEFINITION }}
        run: |
          python terraform/aws/render_task_definition.py \
            terraform/aws/task-definitions/web.json \
            /tmp/web-task-definition.json

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/web-task-definition.json
          service: ${{ env.ECS_WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Render background worker task definition
        if: env.ECS_WORKER_SERVICE != '' && env.ECS_WORKER_TASK_DEFINITION != ''
        env:
          CONTAINER_IMAGE: ${{ steps.build-image.outputs.image }}
          TASK_DEFINITION_FAMILY: ${{ env.ECS_WORKER_TASK_DEFINITION }}
        run: |
          python terraform/aws/render_task_definition.py \
            terraform/aws/task-definitions/background-worker.json \
            /tmp/worker-task-definition.json

      - name: Deploy background worker service
        if: env.ECS_WORKER_SERVICE != '' && env.ECS_WORKER_TASK_DEFINITION != ''
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/worker-task-definition.json
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Commit Terraform image URI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${IMAGE_VARS_FILE}"
          if git diff --cached --quiet; then
            echo "Terraform image URI is already current."
          else
            git commit -m "chore: update deployed image [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
